<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>decision-guard 시험</title></head>
<body>
<h1>decision-guard 시험</h1>
<pre id="out">running…</pre>
<script src="decision-guard.js"></script>
<script>
(function () {
  var out = [];
  function ok(name, cond) { out.push((cond ? "PASS " : "FAIL ") + name); }
  function fakeStore() {
    var m = {};
    return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } };
  }
  var G = window.LODecisionGuard;
  if (!G) { document.getElementById("out").textContent = "FAIL guard not loaded"; return; }

  var S = fakeStore();
  var ID = "blue|commerce|판매 시작 방식 — 사업자 개설 완료(사용자 보고) · 스마트스토어 개설·상품 데이터 준비 중";
  var T0 = 1700000000000;

  ok("headOf splits at — / ·", G.headOf(ID.split("|")[2]) === "판매 시작 방식");

  ok("no receipt -> allowed", G.check(S, { id: ID, title: ID, state: "ok", now: T0 }).blocked === false);

  G.remember(S, { id: ID, title: ID, state: "ok", channel: "ntfy", ref: "abc", at: T0 });

  var a = G.check(S, { id: ID, title: ID, state: "ok", now: T0 + 60000 });
  ok("same id+state 1min later -> blocked(same)", a.blocked === true && a.kind === "same");

  var b = G.check(S, { id: ID, title: ID, state: "no", now: T0 + 5000 });
  ok("same id, other state within 15s -> blocked(jitter)", b.blocked === true && b.kind === "jitter");

  var c = G.check(S, { id: ID, title: ID, state: "no", now: T0 + 600000 });
  ok("same id, other state after 10min -> allowed(변경 접수)", c.blocked === false);

  var ID2 = "blue|commerce|판매 시작 방식 — 다음 확인 11/28 09:00";
  var d = G.check(S, { id: ID2, title: ID2, state: "ok", now: T0 + 20 * 60000 });
  ok("title updated same agenda -> blocked(recent)", d.blocked === true && d.kind === "recent");

  var ID3 = "blue|commerce|다른 안건 — 진행 중";
  ok("other agenda -> allowed", G.check(S, { id: ID3, title: ID3, state: "ok", now: T0 }).blocked === false);

  var e = G.check(S, { id: ID, title: ID, state: "ok", now: T0 + 13 * 3600 * 1000 });
  ok("same id+state after 13h -> allowed(재승인 여지)", e.blocked === false);

  var S2 = fakeStore();
  ok("log capped/flat json", (G.remember(S2, { id: "a|b|c", state: "ok", at: T0 }), G.readLog(S2).length === 1));

  var lines = [
    JSON.stringify({ id: "e1", event: "message", time: Math.floor(T0 / 1000), message: JSON.stringify({ id: ID, state: "ok", label: "승인" }) }),
    JSON.stringify({ id: "e0", event: "open" }),
    JSON.stringify({ id: "e2", event: "message", time: Math.floor((T0 + 1000) / 1000), message: JSON.stringify({ id: ID3, state: "ok" }) })
  ].join("\n");
  var r1 = G.scanRelay(lines, { id: ID, state: "ok" });
  ok("relay: same id+state -> blocked", r1.blocked === true && r1.receipt.relayId === "e1");
  var r2 = G.scanRelay(lines, { id: ID, state: "no" });
  ok("relay: same id other state -> allowed", r2.blocked === false && r2.found === 1);
  var r3 = G.scanRelay(lines, { id: "zzz", state: "ok" });
  ok("relay: unknown id -> allowed", r3.blocked === false);

  var issues = [
    { number: 17, state: "open", body: "안건 ID: " + ID + "\n결정: 승인\n담당: 해병이" },
    { number: 16, state: "open", body: "안건 ID: blue|commerce|다른 안건\n결정: 승인" }
  ];
  var f = G.findOpenIssue(issues, { id: ID });
  ok("open issue lookup by agenda id -> #17", !!f && f.number === 17 && f.decision === "승인");
  ok("open issue lookup miss -> null", G.findOpenIssue(issues, { id: "blue|commerce|없는 안건" }) === null);
  ok("closed issue ignored", G.findOpenIssue([{ number: 9, state: "closed", body: "안건 ID: " + ID }], { id: ID }) === null);

  document.getElementById("out").textContent = out.join("\n") + "\n" + (out.filter(function (x) { return x.indexOf("FAIL") === 0; }).length ? "RESULT FAIL" : "RESULT PASS");
})();
</script>
</body></html>
