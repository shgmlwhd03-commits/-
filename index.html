<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#261f18" />
<title>AI 1인 회사 · LIVE OFFICE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #1c1611;
    color: #f8fafc;
    min-height: 100vh;
    padding: 12px;
  }
  .office-frame {
    max-width: 980px;
    margin: 0 auto;
    background:
      repeating-linear-gradient(
        0deg,
        #3d3024 0px,
        #3d3024 28px,
        #35291e 28px,
        #35291e 30px
      );
    border: 3px solid #6b563f;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.65);
  }
  .topbar {
    background: linear-gradient(180deg, #273042, #1b2230);
    border: 2px solid #475569;
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.3px;
  }
  .live-pill {
    background: #14532d;
    border: 1px solid #22c55e;
    color: #86efac;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .sync-note {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    color: #94a3b8;
    letter-spacing: 0.02em;
  }
  .sync-note.live { color: #86efac; }
  .sync-note.stale { color: #fca5a5; }
  .top-btns { display: flex; gap: 8px; }
  .btn {
    background: #334155;
    color: #f8fafc;
    border: 1px solid #64748b;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-red { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }

  .floor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px;
  }

  .room {
    position: relative;
    background: rgba(24, 28, 36, 0.72);
    border: 2px solid #786248;
    border-radius: 14px;
    padding: 12px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.35s, box-shadow 0.35s, background 0.35s;
  }
  /* 작업 중인 방은 불이 들어온다 */
  .room.working {
    background: rgba(23, 41, 58, 0.78);
    border-color: #38bdf8;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
  }
  .room.alert {
    background: rgba(127, 29, 29, 0.55);
    border-color: #ef4444;
    box-shadow: 0 0 22px rgba(239, 68, 68, 0.45);
  }

  .room-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .room-title {
    background: #27221d;
    border: 1px solid #8c7355;
    color: #fde68a;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .status-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #475569;
    box-shadow: 0 0 4px rgba(71, 85, 105, 0.8);
    cursor: pointer;
    border: 2px solid #0f172a;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .room.working .status-dot {
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
    animation: workPulse 1.4s ease-in-out infinite;
  }
  .room.alert .status-dot {
    background: #ef4444;
    box-shadow: 0 0 12px #ef4444;
    animation: blink 0.6s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1.15); }
    50% { opacity: 0.25; transform: scale(0.85); }
  }
  @keyframes workPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .room-space {
    position: relative;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 6px 4px;
  }

  /* Desks */
  .desk-unit {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .desk-top {
    width: 68px;
    height: 22px;
    background: #926c44;
    border: 2px solid #5c4024;
    border-radius: 5px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pc {
    width: 22px;
    height: 14px;
    background: #38bdf8;
    border: 2px solid #0f172a;
    border-radius: 3px;
    margin-top: -12px;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
    transition: background 0.35s, box-shadow 0.35s, opacity 0.35s;
  }
  /* 대기 중: 모니터가 절전 상태 */
  .room.idle .pc {
    background: #1e3a4c;
    box-shadow: none;
    opacity: 0.7;
  }
  /* 작업 중: 모니터가 활발히 깜빡임 */
  .room.working .pc {
    animation: pcWork 1.1s steps(2, end) infinite;
  }
  @keyframes pcWork {
    0%, 100% { box-shadow: 0 0 6px rgba(56, 189, 248, 0.5); }
    50% { box-shadow: 0 0 16px rgba(56, 189, 248, 0.95); }
  }
  .room.alert .pc {
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }

  /* 캐릭터: 평소엔 조용히 앉아 있고, 필요할 때만 움직인다 */
  .worker {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transform: translateY(0);
  }
  .room.working .worker {
    animation: workBob 0.95s infinite ease-in-out;
    animation-delay: var(--wd, 0s);
  }
  .room.alert .worker {
    animation: panic 0.4s infinite ease-in-out;
  }

  @keyframes workBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-2.5px) rotate(-2deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-2.5px) rotate(2deg); }
  }
  @keyframes panic {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .avatar {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6));
    transition: filter 0.35s;
  }
  .room.idle .avatar { filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6)) saturate(0.7) brightness(0.92); }
  .room.working .avatar { filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6)) drop-shadow(0 0 6px rgba(56,189,248,0.5)); }

  .nametag {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #475569;
    color: #e2e8f0;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 6px;
    margin-top: 2px;
  }
  .speech {
    position: absolute;
    top: -26px;
    white-space: nowrap;
    background: #ffffff;
    color: #0f172a;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  /* 말풍선도 작업 중일 때만 살짝 떠오른다 */
  .room.working .speech { animation: sayFloat 2.6s ease-in-out infinite; }
  @keyframes sayFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .badge-alert {
    display: none;
    position: absolute;
    top: -8px;
    right: -8px;
    background: #ef4444;
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
  }
  .room.alert .badge-alert { display: flex; }

  .room-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    color: #cbd5e1;
    border-top: 1px dashed rgba(148, 163, 184, 0.25);
    padding-top: 6px;
  }
  .room-foot .foot-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resolve-btn {
    display: none;
    flex: none;
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .room.alert .resolve-btn { display: inline-block; }

  /* ===================== LED 전광판 ===================== */
  .led-board {
    position: relative;
    margin-top: 9px;
    display: flex;
    align-items: stretch;
    min-height: 34px;
    background-color: #05080b;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(148, 163, 184, 0.09) 1px, transparent 1.7px);
    background-size: 4px 4px;
    border: 2px solid #1b2733;
    border-radius: 7px;
    box-shadow:
      inset 0 0 14px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(148, 163, 184, 0.12);
    overflow: hidden;
    transition: border-color 0.35s, box-shadow 0.35s, background-color 0.35s;
  }
  .led-board::after {
    /* 스캔라인 */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.35) 0px,
      rgba(0, 0, 0, 0.35) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    );
  }

  .led-tag {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 7px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.09em;
    color: #94a3b8;
    background: linear-gradient(180deg, rgba(148, 163, 184, 0.16), rgba(148, 163, 184, 0.04));
    border-right: 1px solid #1b2733;
    transition: color 0.35s, background 0.35s, border-color 0.35s, text-shadow 0.35s;
  }
  .led-tag i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #64748b;
    transition: background 0.35s, box-shadow 0.35s;
  }

  .led-viewport {
    flex: 1 1 auto;
    min-width: 0;
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .led-track {
    display: inline-flex;
    flex: none;
    white-space: nowrap;
    will-change: transform;
    animation: ledScroll 16s linear infinite;
  }
  .led-group { display: inline-flex; flex: none; }
  .led-text {
    display: inline-block;
    padding-right: 48px;
    font-family: ui-monospace, SFMono-Regular, Menlo, "D2Coding", monospace;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #cbd5e1;
    transition: color 0.35s, text-shadow 0.35s;
  }
  @keyframes ledScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .led-time {
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 7px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.03em;
    color: #94a3b8;
    background: rgba(10, 15, 20, 0.85);
    border-left: 1px solid #1b2733;
    transition: color 0.35s, border-color 0.35s, background 0.35s, text-shadow 0.35s;
  }

  /* ▶ 작업 중: 전광판이 켜지고 맥동한다 */
  .room.working .led-board {
    background-color: #04100c;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(74, 222, 128, 0.15) 1px, transparent 1.7px);
    border-color: #10321f;
    box-shadow:
      inset 0 0 14px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(148, 163, 184, 0.14),
      0 0 14px rgba(34, 197, 94, 0.3);
  }
  .room.working .led-text {
    color: #86efac;
    text-shadow: 0 0 5px rgba(74, 222, 128, 0.9), 0 0 13px rgba(34, 197, 94, 0.5);
    animation: ledGlow 2.2s ease-in-out infinite;
  }
  @keyframes ledGlow {
    0%, 100% { opacity: 1; text-shadow: 0 0 5px rgba(74,222,128,0.9), 0 0 13px rgba(34,197,94,0.5); }
    50% { opacity: 0.82; text-shadow: 0 0 9px rgba(74,222,128,1), 0 0 20px rgba(34,197,94,0.75); }
  }
  .room.working .led-tag {
    color: #4ade80;
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.22), rgba(34, 197, 94, 0.05));
    border-right-color: #14301f;
    text-shadow: 0 0 6px rgba(74, 222, 128, 0.85);
  }
  .room.working .led-tag i {
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: workPulse 1.2s ease-in-out infinite;
  }
  .room.working .led-time {
    color: #5eead4;
    border-left-color: #14301f;
    background: rgba(8, 20, 16, 0.85);
    text-shadow: 0 0 6px rgba(94, 234, 212, 0.8);
  }

  /* ■ 대기: 전광판은 어둡게, 글자만 은은하게 */
  .room.idle .led-text { color: #94a3b8; }
  .room.idle .led-time { color: #64748b; }

  /* 🔴 경보 */
  .room.alert .led-board {
    background-color: #0c0303;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(248, 113, 113, 0.18) 1px, transparent 1.7px);
    border-color: #7f1d1d;
    box-shadow:
      inset 0 0 14px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(148, 163, 184, 0.1),
      0 0 16px rgba(239, 68, 68, 0.6);
    animation: ledAlarm 1.5s ease-in-out infinite;
  }
  @keyframes ledAlarm {
    0%, 100% { box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 10px rgba(239,68,68,0.35); }
    50% { box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 22px rgba(239,68,68,0.85); }
  }
  .room.alert .led-text {
    color: #fecaca;
    text-shadow: 0 0 5px rgba(239, 68, 68, 0.95), 0 0 15px rgba(239, 68, 68, 0.65);
    animation: none;
  }
  .room.alert .led-tag {
    color: #fca5a5;
    background: linear-gradient(180deg, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.06));
    border-right-color: #3f1212;
    text-shadow: 0 0 6px rgba(239, 68, 68, 0.9);
  }
  .room.alert .led-tag i {
    background: #ef4444;
    box-shadow: 0 0 9px #ef4444;
    animation: blink 0.7s infinite;
  }
  .room.alert .led-time {
    color: #fca5a5;
    border-left-color: #3f1212;
    background: rgba(20, 4, 4, 0.85);
    text-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
  }

  /* 새 상태 수신 시 살짝 반짝 */
  .led-board.flash { animation: ledFlash 0.8s ease-out 1; }
  @keyframes ledFlash {
    0% { filter: brightness(2.1); }
    100% { filter: brightness(1); }
  }

  /* 사무실을 돌아다니는 도우미 캐릭터: 작업 중인 부서가 있을 때만 복도에 나온다 */
  #roamers {
    display: none;
    position: relative;
    height: 62px;
    margin: 0 0 12px;
    border-radius: 10px;
    border: 1px dashed rgba(140, 115, 85, 0.5);
    background: linear-gradient(180deg, rgba(45, 36, 27, 0.55), rgba(24, 19, 15, 0.55));
    overflow: hidden;
  }
  #roamers.show { display: block; }
  .hall-item {
    position: absolute;
    top: 5px;
    left: 12%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left 3.2s cubic-bezier(0.45, 0, 0.55, 1);
    white-space: nowrap;
  }
  .hall-item .say {
    background: #fff;
    color: #0f172a;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 6px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
    margin-bottom: 1px;
  }
  .hall-item .body { font-size: 20px; line-height: 1; }
  .hall-item .who {
    font-size: 8.5px;
    font-weight: 800;
    color: #e2e8f0;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid #475569;
    border-radius: 5px;
    padding: 0 4px;
    margin-top: 1px;
  }

  @media (max-width: 520px) {
    .led-text { font-size: 10.5px; padding-right: 34px; }
    .led-time { font-size: 9px; padding: 0 5px; }
  }
</style>
</head>
<body>
<div class="office-frame">
  <div class="topbar">
    <div class="brand">
      <span>🏢 AI 1인 회사 · LIVE OFFICE</span>
      <span class="live-pill" id="summary-pill">상태 확인 중</span>
      <span class="sync-note" id="sync-note">status.json 동기화 중…</span>
    </div>
    <div class="top-btns">
      <button class="btn btn-red" onclick="testAlert()">🚨 빨간불 테스트</button>
      <button class="btn" onclick="clearAll()">✅ 전체 복구</button>
    </div>
  </div>

  <div class="floor-grid" id="floor"></div>
  <div id="roamers" aria-hidden="true"></div>
</div>

<script>
// 부서 간 이동 도우미: 작업 중인 부서가 하나라도 있을 때만 움직인다.
const roamers = [
  { avatar: "🤖", name: "전달봇", say: "자료 전달 중!" },
  { avatar: "🧑‍🚀", name: "지원팀", say: "수고 많으십니다 :)" }
];
let roamTimer = null;

function buildRoamers() {
  const wrap = document.getElementById("roamers");
  if (!wrap) return;
  wrap.innerHTML = roamers.map((rm, idx) => `
    <div class="hall-item" id="roamer-${idx}">
      <div class="say">${rm.say}</div>
      <div class="body">${rm.avatar}</div>
      <div class="who">${rm.name}</div>
    </div>
  `).join("");
}

function moveRoamers() {
  roamers.forEach((rm, idx) => {
    const el = document.getElementById("roamer-" + idx);
    if (!el) return;
    el.style.left = (10 + Math.random() * 76) + "%";
  });
}

function setRoamActive(on) {
  const wrap = document.getElementById("roamers");
  if (!wrap) return;
  if (on) {
    wrap.classList.add("show");
    if (!roamTimer) {
      roamTimer = setInterval(moveRoamers, 3400);
      moveRoamers();
    }
  } else {
    if (roamTimer) { clearInterval(roamTimer); roamTimer = null; }
    wrap.classList.remove("show");
  }
}

// 개인정보 없음: 부서 상태 문구만 담는다. status.json 연결 실패 시 아래 값이 그대로 표시된다.
// state: working(작업 중) | idle(대기) | alert(경보)
const rooms = [
  {
    id: "ceo",
    title: "👑 대표실",
    worker: "🧑‍💼",
    name: "대표",
    say: "오늘 수익화 가보자!",
    foot: "최종 승인 · 총괄 지휘",
    issue: "승인 대기 중인 건이 있어요!",
    state: "idle",
    ticker: "총괄 지휘 중 · 비용 0원 원칙 가동",
    updated: "21:55"
  },
  {
    id: "grant",
    title: "🏛️ 지원금·공모주팀",
    worker: "👩‍🔬",
    name: "조사원 01",
    say: "청약 일정 스캔 중",
    foot: "매일 08:30 브리핑",
    issue: "공모주 페이지 확인 필요!",
    state: "idle",
    ticker: "1차 스캔 완료 (아델·장려금 12/1 마감 등)",
    updated: "21:42"
  },
  {
    id: "naver",
    title: "✍️ 네이버 블로그팀",
    worker: "🧑‍💻",
    name: "작가 02",
    say: "초안 쓰는 중…",
    foot: "매일 09:00 · 네이버 블로그",

const STATE_LABEL = { working: "WORK", idle: "IDLE", alert: "ALERT" };

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function render() {
  document.getElementById("floor").innerHTML = rooms.map((r, i) => `
    <div class="room ${r.state}" id="room-${r.id}" style="--wd:${(i * 0.27).toFixed(2)}s">
      <div class="room-head">
        <span class="room-title">${r.title}</span>
        <span class="status-dot" title="상태 전환 (수동 경보)" onclick="toggleRoom('${r.id}')"></span>
      </div>
      <div class="room-space">
        <div class="worker" onclick="toggleRoom('${r.id}')">
          <div class="speech" id="say-${r.id}">${r.say}</div>
          <div class="badge-alert">!</div>
          <div class="avatar">${r.worker}</div>
          <div class="nametag">${r.name}</div>
        </div>
        <div class="desk-unit">
          <div class="desk-top"><div class="pc"></div></div>
        </div>
      </div>
      <div class="led-board" id="led-${r.id}">
        <span class="led-tag"><i></i><span id="tag-${r.id}">${STATE_LABEL[r.state]}</span></span>
        <span class="led-viewport" id="vp-${r.id}">
          <span class="led-track" id="track-${r.id}"></span>
        </span>
        <span class="led-time" id="time-${r.id}" title="마지막 갱신">--:--</span>
      </div>
      <div class="room-foot">
        <span class="foot-txt" id="foot-${r.id}">${r.foot}</span>
        <button class="resolve-btn" onclick="toggleRoom('${r.id}')">해결 완료</button>
      </div>
    </div>
  `).join("");
  // 전광판 기본 문구 먼저 표시 (status.json 오기 전에도 꽉 차 보이게)
  rooms.forEach(r => setBoardText(r.id, tickerFor(r.state, r.ticker), r.updated));
  applyRoam();
}

/* ---------------- 전광판 ---------------- */
function tickerFor(state, text) {
  if (state === "alert") return "🔴 " + String(text).replace(/^🔴\s*/, "");
  return text;
}

function setBoardText(id, text, updated) {
  const track = document.getElementById("track-" + id);
  const vp = document.getElementById("vp-" + id);
  if (!track) return;
  if (track.dataset.text !== text) {
    track.dataset.text = text;
    const vw = (vp && vp.clientWidth) || 200;
    const oneW = Math.max(70, text.length * 7.6 + 48);
    const copies = Math.max(1, Math.ceil(vw / oneW));
    const group = Array.from({ length: copies }, () =>
      `<span class="led-text">${esc(text)}</span>`).join("");
    track.innerHTML =
      `<span class="led-group">${group}</span><span class="led-group" aria-hidden="true">${group}</span>`;
    const groupW = copies * oneW;
    const dur = Math.max(9, Math.min(34, groupW / 46));
    track.style.animation = "none";
    void track.offsetWidth;
    track.style.animation = "ledScroll " + dur.toFixed(1) + "s linear infinite";
  }
  if (updated !== undefined) {
    const t = document.getElementById("time-" + id);
    if (t) t.textContent = updated || "--:--";
  }
}

function flashBoard(id) {
  const b = document.getElementById("led-" + id);
  if (!b) return;
  b.classList.remove("flash");
  void b.offsetWidth;
  b.classList.add("flash");
}

function setRoomState(id, state) {
  const el = document.getElementById("room-" + id);
  if (!el) return;
  el.classList.remove("working", "idle", "alert");
  el.classList.add(state);
  const tag = document.getElementById("tag-" + id);
  if (tag) tag.textContent = STATE_LABEL[state] || "IDLE";
}

let STATUS = null;      // 마지막으로 받은 status.json
let lastSync = "";

function applyStatus(data) {
  const src = (data && typeof data === "object" && !Array.isArray(data)) ? data : {};

  rooms.forEach(r => {
    const s = src[r.id] || {};
    let state;
    if (!s.status) state = r.state || "idle";
    else if (s.status === "alert") state = "alert";
    else if (s.status === "working") state = "working";
    else state = "idle";

    const tickerRaw = (typeof s.ticker === "string" && s.ticker.trim()) ? s.ticker.trim() : r.ticker;
    const updated = (typeof s.updated === "string" && s.updated.trim()) ? s.updated.trim() : r.updated;
    const ticker = tickerFor(state, tickerRaw);

    const track = document.getElementById("track-" + r.id);
    const before = track ? track.dataset.text : undefined;
    setBoardText(r.id, ticker, updated);

    const el = document.getElementById("room-" + r.id);
    if (!el) return;

    setRoomState(r.id, state);

    const say = document.getElementById("say-" + r.id);
    const foot = document.getElementById("foot-" + r.id);
    if (state === "alert") {
      if (say) say.textContent = "도와주세요! 🚨";
      if (foot) foot.textContent = "🔴 " + r.issue;
    } else {
      if (say) say.textContent = r.say;
      if (foot) foot.textContent = r.foot;
    }
    if (before !== undefined && before !== ticker) flashBoard(r.id);
  });

  applyRoam();
  updatePill();
}

function applyRoam() {
  const working = document.querySelectorAll(".room.working").length;
  setRoamActive(working > 0);
}

function setSyncNote(ok, msg) {
  const n = document.getElementById("sync-note");
  if (!n) return;
  n.textContent = msg;
  n.className = "sync-note " + (ok ? "live" : "stale");
}

function hhmm() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

async function loadStatus() {
  try {
    const res = await fetch("./status.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    applyStatus(data);
    STATUS = data;
    lastSync = hhmm();
    setSyncNote(true, "● status.json 동기화 " + lastSync);
  } catch (e) {
    if (!STATUS) {
      // 한 번도 못 받았을 때만 기본 문구/기본 상태 사용
      applyStatus(null);
      setSyncNote(false, "○ 기본 상태 표시 (status.json 대기)");
    } else {
      setSyncNote(false, "○ 연결 지연 · 마지막 상태 유지");
    }
  }
}

function toggleRoom(id) {
  const r = rooms.find(x => x.id === id);
  const el = document.getElementById("room-" + id);
  const say = document.getElementById("say-" + id);
  const foot = document.getElementById("foot-" + id);
  if (el.classList.contains("alert")) {
    setRoomState(id, r.state || "idle");
    say.textContent = r.say;
    foot.textContent = r.foot;
  } else {
    setRoomState(id, "alert");
    say.textContent = "도와주세요! 🚨";
    foot.textContent = "🔴 " + r.issue;
  }
  applyRoam();
  updatePill();
}

function testAlert() {
  const candidates = rooms.filter(r => r.id !== "ceo");
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const el = document.getElementById("room-" + pick.id);
  if (!el.classList.contains("alert")) toggleRoom(pick.id);
}

function clearAll() {
  rooms.forEach(r => {
    const el = document.getElementById("room-" + r.id);
    if (el.classList.contains("alert")) toggleRoom(r.id);
  });
}

function updatePill() {
  const alerts = document.querySelectorAll(".room.alert").length;
  const working = document.querySelectorAll(".room.working").length;
  const pill = document.getElementById("summary-pill");
  if (alerts > 0) {
    pill.textContent = `🔴 해결 요청 ${alerts}건`;
    pill.style.background = "#7f1d1d";
    pill.style.borderColor = "#ef4444";
    pill.style.color = "#fecaca";
  } else if (working > 0) {
    pill.textContent = `🟢 ${working}개 부서 작업 중 · ${rooms.length - working}곳 대기`;
    pill.style.background = "#0c2d48";
    pill.style.borderColor = "#38bdf8";
    pill.style.color = "#bae6fd";
  } else {
    pill.textContent = "💤 전체 대기 · 다음 일정 대기 중";
    pill.style.background = "#1e293b";
    pill.style.borderColor = "#64748b";
    pill.style.color = "#cbd5e1";
  }
}

buildRoamers();
render();
updatePill();
loadStatus();
setInterval(loadStatus, 60000);
</script>
