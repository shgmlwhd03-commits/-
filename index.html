<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#261f18" />
<title>AI 1인 회사 · LIVE OFFICE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #1c1611;
    color: #f8fafc;
    min-height: 100vh;
    padding: 12px;
  }
  .office-frame {
    max-width: 980px;
    margin: 0 auto;
    background:
      repeating-linear-gradient(
        0deg,
        #3d3024 0px,
        #3d3024 28px,
        #35291e 28px,
        #35291e 30px
      );
    border: 3px solid #6b563f;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.65);
  }
  .topbar {
    background: linear-gradient(180deg, #273042, #1b2230);
    border: 2px solid #475569;
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.3px;
  }
  .live-pill {
    background: #14532d;
    border: 1px solid #22c55e;
    color: #86efac;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .top-btns { display: flex; gap: 8px; }
  .btn {
    background: #334155;
    color: #f8fafc;
    border: 1px solid #64748b;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-red { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }

  .floor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px;
  }

  .room {
    position: relative;
    background: rgba(24, 28, 36, 0.72);
    border: 2px solid #786248;
    border-radius: 14px;
    padding: 12px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .room.alert {
    background: rgba(127, 29, 29, 0.55);
    border-color: #ef4444;
    box-shadow: 0 0 22px rgba(239, 68, 68, 0.45);
  }

  .room-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .room-title {
    background: #27221d;
    border: 1px solid #8c7355;
    color: #fde68a;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .status-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    cursor: pointer;
    border: 2px solid #0f172a;
  }
  .room.alert .status-dot {
    background: #ef4444;
    box-shadow: 0 0 12px #ef4444;
    animation: blink 0.6s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1.15); }
    50% { opacity: 0.25; transform: scale(0.85); }
  }

  .room-space {
    position: relative;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 6px 4px;
  }

  /* Desks */
  .desk-unit {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .desk-top {
    width: 68px;
    height: 22px;
    background: #926c44;
    border: 2px solid #5c4024;
    border-radius: 5px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pc {
    width: 22px;
    height: 14px;
    background: #38bdf8;
    border: 2px solid #0f172a;
    border-radius: 3px;
    margin-top: -12px;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
  }
  .room.alert .pc {
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }

  /* Moving Character */
  .worker {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: roam 3.6s infinite ease-in-out;
    cursor: pointer;
  }
  .room:nth-child(even) .worker { animation-delay: 1.1s; }
  .room.alert .worker { animation: panic 0.4s infinite ease-in-out; }

  @keyframes roam {
    0%, 100% { transform: translate(0, 0); }
    35% { transform: translate(8px, -4px); }
    70% { transform: translate(-7px, -2px); }
  }
  @keyframes panic {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .avatar {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6));
  }
  .nametag {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #475569;
    color: #e2e8f0;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 6px;
    margin-top: 2px;
  }
  .speech {
    position: absolute;
    top: -26px;
    white-space: nowrap;
    background: #ffffff;
    color: #0f172a;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    animation: pop 4s infinite;
  }
  .badge-alert {
    display: none;
    position: absolute;
    top: -8px;
    right: -8px;
    background: #ef4444;
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
  }
  .room.alert .badge-alert { display: flex; }

  .room-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: #cbd5e1;
    border-top: 1px dashed rgba(148, 163, 184, 0.25);
    padding-top: 6px;
  }
  .resolve-btn {
    display: none;
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .room.alert .resolve-btn { display: inline-block; }
</style>
</head>
<body>
<div class="office-frame">
  <div class="topbar">
    <div class="brand">
      <span>🏢 AI 1인 회사 · LIVE OFFICE</span>
      <span class="live-pill" id="summary-pill">6개 부서 가동 중</span>
    </div>
    <div class="top-btns">
      <button class="btn btn-red" onclick="testAlert()">🚨 빨간불 테스트</button>
      <button class="btn" onclick="clearAll()">✅ 전체 복구</button>
    </div>
  </div>

  <div class="floor-grid" id="floor"></div>
  <div id="roamers" style="position:relative; height:0; overflow:visible; pointer-events:none;"></div>
</div>

<script>
// Cross-department roaming characters
const roamers = [
  { avatar: "🤖", name: "전달봇", say: "자료 전달 중!", startX: 15, startY: -220 },
  { avatar: "🧑‍🚀", name: "지원팀", say: "수고 많으십니다 :)", startX: 65, startY: -120 }
];
function animateRoamers() {
  const wrap = document.getElementById("roamers");
  if (!wrap) return;
  wrap.innerHTML = roamers.map((rm, idx) => `
    <div id="roamer-${idx}" style="position:absolute; left:${rm.startX}%; top:${rm.startY}px; transition: all 3.2s ease-in-out; z-index:20; display:flex; flex-direction:column; align-items:center;">
      <div style="background:#fff;color:#0f172a;font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,0.35);margin-bottom:2px;white-space:nowrap;">${rm.say}</div>
      <div style="font-size:28px;filter:drop-shadow(0 4px 4px rgba(0,0,0,0.6));">${rm.avatar}</div>
      <div style="background:rgba(15,23,42,0.9);border:1px solid #475569;color:#e2e8f0;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;">${rm.name}</div>
    </div>
  `).join("");
  setInterval(() => {
    roamers.forEach((rm, idx) => {
      const el = document.getElementById("roamer-" + idx);
      if (!el) return;
      el.style.left = (8 + Math.random() * 78) + "%";
      el.style.top = (-320 + Math.random() * 260) + "px";
    });
  }, 3400);
}

const rooms = [
  {
    id: "ceo",
    title: "👑 대표실",
    worker: "🧑‍💼",
    name: "대표",
    say: "오늘 수익화 가보자!",
    foot: "최종 승인 · 총괄 지휘",
    issue: "승인 대기 중인 건이 있어요!"
  },
  {
    id: "grant",
    title: "🏛️ 지원금·공모주팀",
    worker: "👩‍🔬",
    name: "조사원 01",
    say: "청약 일정 스캔 중",
    foot: "매일 08:30 브리핑",
    issue: "공모주 페이지 확인 필요!"
  },
  {
    id: "naver",
    title: "✍️ 네이버 블로그팀",
    worker: "🧑‍💻",
    name: "작가 02",
    say: "임시저장 완료!",
    foot: "매일 09:00 · 네이버 블로그",
    issue: "네이버 재로그인 필요!"
  },
  {
    id: "tistory",
    title: "💵 애드센스 사업부",
    worker: "🤵",
    name: "매니저 03",
    say: "고단가 키워드 찾는 중",
    foot: "매일 11:00 · 티스토리",
    issue: "카카오 인증이 필요해요!"
  },
  {
    id: "deal",
    title: "🛒 핫딜·포인트팀",
    worker: "🕵️",
    name: "탐정 04",
    say: "적립 이벤트 체크!",
    foot: "매일 12:30 · 비용 0원",
    issue: "이벤트 링크 변경됨!"
  },
  {
    id: "prize",
    title: "🎯 경품 응모팀",
    worker: "🧙",
    name: "마법사 05",
    say: "무료 경품 응모 중~",
    foot: "매일 15:00 · 자동 응모",
    issue: "본인인증 팝업 떴어요!"
  }
];

function render() {
  document.getElementById("floor").innerHTML = rooms.map(r => `
    <div class="room" id="room-${r.id}">
      <div class="room-head">
        <span class="room-title">${r.title}</span>
        <span class="status-dot" title="상태 전환" onclick="toggleRoom('${r.id}')"></span>
      </div>
      <div class="room-space">
        <div class="worker" onclick="toggleRoom('${r.id}')">
          <div class="speech" id="say-${r.id}">${r.say}</div>
          <div class="badge-alert">!</div>
          <div class="avatar">${r.worker}</div>
          <div class="nametag">${r.name}</div>
        </div>
        <div class="desk-unit">
          <div class="desk-top"><div class="pc"></div></div>
        </div>
      </div>
      <div class="room-foot">
        <span id="foot-${r.id}">${r.foot}</span>
        <button class="resolve-btn" onclick="toggleRoom('${r.id}')">해결 완료</button>
      </div>
    </div>
  `).join("");
}

function toggleRoom(id) {
  const r = rooms.find(x => x.id === id);
  const el = document.getElementById("room-" + id);
  const say = document.getElementById("say-" + id);
  const foot = document.getElementById("foot-" + id);
  el.classList.toggle("alert");
  if (el.classList.contains("alert")) {
    say.textContent = "도와주세요! 🚨";
    foot.textContent = "🔴 " + r.issue;
  } else {
    say.textContent = r.say;
    foot.textContent = r.foot;
  }
  updatePill();
}

function testAlert() {
  const candidates = rooms.filter(r => r.id !== "ceo");
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const el = document.getElementById("room-" + pick.id);
  if (!el.classList.contains("alert")) toggleRoom(pick.id);
}

function clearAll() {
  rooms.forEach(r => {
    const el = document.getElementById("room-" + r.id);
    if (el.classList.contains("alert")) toggleRoom(r.id);
  });
}

function updatePill() {
  const alerts = document.querySelectorAll(".room.alert").length;
  const pill = document.getElementById("summary-pill");
  if (alerts > 0) {
    pill.textContent = `🔴 해결 요청 ${alerts}건`;
    pill.style.background = "#7f1d1d";
    pill.style.borderColor = "#ef4444";
    pill.style.color = "#fecaca";
  } else {
    pill.textContent = "6개 부서 가동 중";
    pill.style.background = "#14532d";
    pill.style.borderColor = "#22c55e";
    pill.style.color = "#86efac";
  }
}

render();
animateRoamers();
</script>
</body>
</html>
