<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1120" />
<title>AI 1인 회사 · 라이브 관제탑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #0b1120;
    color: #f8fafc;
    min-height: 100vh;
    padding: 18px 14px 40px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  .header {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 2px solid #334155;
    border-radius: 18px;
    padding: 18px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: #334155;
    color: #f8fafc;
    border: 1px solid #475569;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .btn:hover { background: #475569; }
  .btn:active { transform: scale(0.97); }
  .btn-danger { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }
  .btn-danger:hover { background: #991b1b; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 16px;
  }

  .booth {
    position: relative;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 18px;
    padding: 16px;
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .booth.alert {
    border-color: #ef4444;
    box-shadow: 0 0 24px rgba(239, 68, 68, 0.35);
    animation: shake 0.45s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .booth-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .dept-name { font-size: 15px; font-weight: 800; }
  .dept-time {
    font-size: 11px;
    color: #cbd5e1;
    background: #0f172a;
    padding: 3px 8px;
    border-radius: 8px;
    margin-top: 3px;
    display: inline-block;
  }

  .orb-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    background: #064e3b;
    border: 1px solid #10b981;
    color: #a7f3d0;
    cursor: pointer;
  }
  .orb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
    animation: pulseGreen 1.8s infinite;
  }
  .booth.alert .orb-wrap {
    background: #7f1d1d;
    border-color: #ef4444;
    color: #fecaca;
  }
  .booth.alert .orb {
    background: #ef4444;
    box-shadow: 0 0 12px #ef4444;
    animation: blinkRed 0.6s infinite;
  }
  @keyframes pulseGreen {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.85); }
  }
  @keyframes blinkRed {
    0%, 100% { opacity: 1; transform: scale(1.15); }
    50% { opacity: 0.2; transform: scale(0.8); }
  }

  /* Office stage */
  .stage {
    position: relative;
    height: 135px;
    background: radial-gradient(circle at 50% 35%, #1e3a5f 0%, #0f172a 85%);
    border-radius: 14px;
    border: 1px solid #334155;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
    overflow: hidden;
  }
  .desk {
    width: 150px;
    height: 28px;
    background: #78350f;
    border-top: 4px solid #b45309;
    border-radius: 6px 6px 2px 2px;
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .monitor {
    width: 54px;
    height: 36px;
    background: #38bdf8;
    border: 3px solid #1e293b;
    border-radius: 5px;
    position: absolute;
    top: -32px;
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    animation: screenGlow 2s infinite alternate;
  }
  .booth.alert .monitor {
    background: #ef4444;
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
  }
  @keyframes screenGlow {
    from { filter: brightness(0.9); }
    to { filter: brightness(1.15); }
  }

  .char {
    position: absolute;
    bottom: 34px;
    z-index: 2;
    font-size: 44px;
    animation: workBob 0.9s infinite ease-in-out;
    user-select: none;
  }
  .booth:nth-child(2) .char { animation-delay: 0.2s; }
  .booth:nth-child(3) .char { animation-delay: 0.4s; }
  .booth:nth-child(4) .char { animation-delay: 0.15s; }
  .booth:nth-child(5) .char { animation-delay: 0.35s; }
  .booth.alert .char { animation: panicJump 0.45s infinite ease-in-out; }

  @keyframes workBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(-2deg); }
  }
  @keyframes panicJump {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .float-icon {
    position: absolute;
    font-size: 18px;
    opacity: 0.85;
    animation: floatUp 2.6s infinite ease-in-out;
  }
  .fi1 { left: 22px; top: 24px; }
  .fi2 { right: 24px; top: 30px; animation-delay: 1.1s; }
  @keyframes floatUp {
    0%, 100% { transform: translateY(0); opacity: 0.7; }
    50% { transform: translateY(-8px); opacity: 1; }
  }

  .desc {
    font-size: 13px;
    color: #cbd5e1;
    margin-top: 12px;
    line-height: 1.45;
  }

  .alert-box {
    display: none;
    margin-top: 10px;
    background: rgba(127, 29, 29, 0.75);
    border: 1px solid #ef4444;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: #fee2e2;
  }
  .booth.alert .alert-box { display: block; }
  .alert-box strong { color: #fca5a5; display: block; margin-bottom: 4px; }
  .resolve-btn {
    margin-top: 8px;
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>🏢 AI 1인 회사 · 라이브 관제탑</h1>
      <p>직원 5명 실시간 가동 중 · 상태 배지를 누르면 문제(빨간불) 알림을 테스트할 수 있어요</p>
    </div>
    <div class="controls">
      <button class="btn btn-danger" onclick="triggerRandomAlert()">🚨 문제 발생 테스트</button>
      <button class="btn" onclick="resetAll()">✅ 전체 정상 복구</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const depts = [
  {
    id: 1,
    name: "1. 지원금·공모주 조사원",
    time: "매일 08:30",
    char: "🧑‍🔬",
    icons: ["📊", "🏛️"],
    desc: "정부 지원금·환급금·공모주 일정 스캔 및 아침 브리핑",
    issue: "공모주 일정 페이지 접속 지연 — 확인이 필요해요!"
  },
  {
    id: 2,
    name: "2. 네이버 블로그 작가",
    time: "매일 09:00",
    char: "🧑‍💻",
    icons: ["✍️", "📝"],
    desc: "트렌드 키워드 글 작성 → 임시저장함 저장 (게시 승인 대기)",
    issue: "네이버 로그인 세션 만료! 재로그인해 주세요."
  },
  {
    id: 3,
    name: "3. 티스토리 애드센스 매니저",
    time: "매일 11:00",
    char: "🤵",
    icons: ["💵", "📈"],
    desc: "고단가 키워드 장문 글 작성 → 티스토리 임시저장",
    issue: "카카오 인증이 다시 필요해요! 확인 부탁드립니다."
  },
  {
    id: 4,
    name: "4. 핫딜·포인트 탐정",
    time: "매일 12:30",
    char: "🕵️",
    icons: ["🏷️", "🪙"],
    desc: "네이버페이 적립·출석·특가 핫딜 모니터링",
    issue: "이벤트 페이지 구조 변경으로 확인이 필요해요."
  },
  {
    id: 5,
    name: "5. 경품 응모 마법사",
    time: "매일 15:00",
    char: "🧙",
    icons: ["🎫", "🎁"],
    desc: "비용 0원 경품·기프티콘 탐색 및 자동 응모 후 보고",
    issue: "응모 폼에 추가 본인인증이 떠서 승인 요청드려요!"
  }
];

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = depts.map(d => `
    <div class="booth" id="booth-${d.id}">
      <div class="booth-top">
        <div>
          <div class="dept-name">${d.name}</div>
          <span class="dept-time">${d.time}</span>
        </div>
        <div class="orb-wrap" onclick="toggleAlert(${d.id})">
          <span class="orb"></span>
          <span class="orb-label">가동 중</span>
        </div>
      </div>
      <div class="stage">
        <span class="float-icon fi1">${d.icons[0]}</span>
        <span class="float-icon fi2">${d.icons[1]}</span>
        <div class="char">${d.char}</div>
        <div class="desk"><div class="monitor"></div></div>
      </div>
      <p class="desc">${d.desc}</p>
      <div class="alert-box">
        <strong>🔴 해결 요청!</strong>
        <span>${d.issue}</span><br/>
        <button class="resolve-btn" onclick="toggleAlert(${d.id})">해결 완료 (복구)</button>
      </div>
    </div>
  `).join("");
}

function toggleAlert(id) {
  const el = document.getElementById("booth-" + id);
  const label = el.querySelector(".orb-label");
  el.classList.toggle("alert");
  label.textContent = el.classList.contains("alert") ? "해결 요청!" : "가동 중";
}

function triggerRandomAlert() {
  const pick = depts[Math.floor(Math.random() * depts.length)].id;
  const el = document.getElementById("booth-" + pick);
  if (!el.classList.contains("alert")) toggleAlert(pick);
}

function resetAll() {
  depts.forEach(d => {
    const el = document.getElementById("booth-" + d.id);
    el.classList.remove("alert");
    el.querySelector(".orb-label").textContent = "가동 중";
  });
}

render();
</script>
</body>
</html>
