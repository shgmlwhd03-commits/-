<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#261f18" />
<title>AI 1인 회사 · LIVE OFFICE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #1c1611;
    color: #f8fafc;
    min-height: 100vh;
    padding: 8px;
  }
  .office-frame {
    max-width: 980px;
    margin: 0 auto;
    background:
      repeating-linear-gradient(
        0deg,
        #3d3024 0px,
        #3d3024 28px,
        #35291e 28px,
        #35291e 30px
      );
    border: 2px solid #6b563f;
    border-radius: 14px;
    padding: 9px 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.65);
  }
  .topbar {
    background: linear-gradient(180deg, #273042, #1b2230);
    border: 2px solid #475569;
    border-radius: 9px;
    padding: 6px 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: 0.2px;
  }
  .live-pill {
    background: #14532d;
    border: 1px solid #22c55e;
    color: #86efac;
    font-size: 9.5px;
    padding: 1px 7px;
    border-radius: 999px;
  }
  .sync-note {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 0.02em;
  }
  .sync-note.live { color: #86efac; }
  .sync-note.stale { color: #fca5a5; }
  .top-btns { display: flex; gap: 5px; }
  .btn {
    background: #334155;
    color: #f8fafc;
    border: 1px solid #64748b;
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-red { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }

  .floor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(182px, 1fr));
    gap: 7px;
  }
  /* 대표실은 수익 그래프 자리를 위해 두 칸을 쓴다 */
  .room--ceo { grid-column: span 2; }
  /* 화면 폭이 넓을 때는 열 수를 고정해 7개 방이 2~3줄에 딱 들어오게 한다 */
  @media (min-width: 820px) {
    .floor-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (min-width: 561px) and (max-width: 819px) {
    .floor-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .room {
    position: relative;
    background: rgba(24, 28, 36, 0.72);
    border: 2px solid #786248;
    border-radius: 10px;
    padding: 7px 8px;
    min-height: 122px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.35s, box-shadow 0.35s, background 0.35s;
  }
  /* 작업 중인 방은 불이 들어온다 */
  .room.working {
    background: rgba(23, 41, 58, 0.78);
    border-color: #38bdf8;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
  }
  .room.alert {
    background: rgba(127, 29, 29, 0.55);
    border-color: #ef4444;
    box-shadow: 0 0 22px rgba(239, 68, 68, 0.45);
  }

  .room-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    margin-bottom: 4px;
  }
  .room-title {
    background: #27221d;
    border: 1px solid #8c7355;
    color: #fde68a;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-dot {
    flex: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #475569;
    box-shadow: 0 0 4px rgba(71, 85, 105, 0.8);
    cursor: pointer;
    border: 1.5px solid #0f172a;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .room.working .status-dot {
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
    animation: workPulse 1.4s ease-in-out infinite;
  }
  .room.alert .status-dot {
    background: #ef4444;
    box-shadow: 0 0 12px #ef4444;
    animation: blink 0.6s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1.15); }
    50% { opacity: 0.25; transform: scale(0.85); }
  }
  @keyframes workPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .room-space {
    position: relative;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 6px;
    padding: 13px 2px 2px;
  }
  /* 대표실: 캐릭터 옆에 수익 그래프가 붙는다 */
  .room--ceo .room-space { justify-content: flex-start; gap: 8px; }
  /* 왼쪽 끝에 붙은 캐릭터라 말풍선은 오른쪽으로 펼친다 (카드 밖으로 나가지 않게) */
  .room--ceo .speech { left: 0; translate: 0 0; }

  /* Desks */
  .desk-unit {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .desk-top {
    width: 52px;
    height: 17px;
    background: #926c44;
    border: 2px solid #5c4024;
    border-radius: 5px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pc {
    width: 16px;
    height: 11px;
    background: #38bdf8;
    border: 2px solid #0f172a;
    border-radius: 3px;
    margin-top: -9px;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
    transition: background 0.35s, box-shadow 0.35s, opacity 0.35s;
  }
  /* 대기 중: 모니터가 절전 상태 */
  .room.idle .pc {
    background: #1e3a4c;
    box-shadow: none;
    opacity: 0.7;
  }
  /* 작업 중: 모니터가 활발히 깜빡임 */
  .room.working .pc {
    animation: pcWork 1.1s steps(2, end) infinite;
  }
  @keyframes pcWork {
    0%, 100% { box-shadow: 0 0 6px rgba(56, 189, 248, 0.5); }
    50% { box-shadow: 0 0 16px rgba(56, 189, 248, 0.95); }
  }
  .room.alert .pc {
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }

  /* 캐릭터: 평소엔 조용히 앉아 있고, 필요할 때만 움직인다 */
  .worker {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transform: translateY(0);
  }
  .room.working .worker {
    animation: workBob 0.95s infinite ease-in-out;
    animation-delay: var(--wd, 0s);
  }
  .room.alert .worker {
    animation: panic 0.4s infinite ease-in-out;
  }

  @keyframes workBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-2.5px) rotate(-2deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-2.5px) rotate(2deg); }
  }
  @keyframes panic {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .avatar {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6));
    transition: filter 0.35s;
  }
  .room.idle .avatar { filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6)) saturate(0.7) brightness(0.92); }
  .room.working .avatar { filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6)) drop-shadow(0 0 6px rgba(56,189,248,0.5)); }

  .nametag {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #475569;
    color: #e2e8f0;
    font-size: 8px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 5px;
    margin-top: 1px;
  }
  .speech {
    position: absolute;
    top: -16px;
    left: 50%;
    translate: -50% 0;
    max-width: 132px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: #ffffff;
    color: #0f172a;
    font-size: 8px;
    font-weight: 800;
    padding: 2px 5px;
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  /* 말풍선도 작업 중일 때만 살짝 떠오른다 */
  .room.working .speech { animation: sayFloat 2.6s ease-in-out infinite; }
  @keyframes sayFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .badge-alert {
    display: none;
    position: absolute;
    top: -8px;
    right: -8px;
    background: #ef4444;
    color: #fff;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    font-size: 9px;
    font-weight: 900;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #fff;
  }
  .room.alert .badge-alert { display: flex; }

  .room-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    font-size: 9px;
    color: #cbd5e1;
    border-top: 1px dashed rgba(148, 163, 184, 0.25);
    padding-top: 3px;
    margin-top: 4px;
  }
  .room-foot .foot-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resolve-btn {
    display: none;
    flex: none;
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 9px;
    font-weight: 800;
    cursor: pointer;
  }
  .room.alert .resolve-btn { display: inline-block; }

  /* 🔴 경보 박스: 원인 + 해결 안내 + 원클릭 조치 */
  .alert-box {
    display: none;
    margin-top: 5px;
    background: rgba(69, 10, 10, 0.72);
    border: 1px solid #ef4444;
    border-radius: 7px;
    padding: 5px 6px 6px;
    box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.22);
  }
  .room.alert .alert-box { display: block; }
  .alert-guide {
    font-size: 9px;
    line-height: 1.35;
    font-weight: 700;
    color: #fecaca;
    margin-bottom: 4px;
    word-break: keep-all;
  }
  .alert-guide .guide-tag {
    display: inline-block;
    background: rgba(239, 68, 68, 0.28);
    border: 1px solid rgba(239, 68, 68, 0.55);
    color: #fee2e2;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.04em;
    border-radius: 3px;
    padding: 0 3px;
    margin-right: 3px;
  }
  .alert-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .copy-btn {
    background: #1f2937;
    border: 1px solid #94a3b8;
    color: #e2e8f0;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 9px;
    font-weight: 800;
    cursor: pointer;
  }
  .copy-btn:active { background: #334155; }
  .copy-toast {
    display: none;
    margin-top: 6px;
    background: #052e16;
    border: 1px solid #22c55e;
    color: #86efac;
    font-size: 9px;
    font-weight: 800;
    line-height: 1.35;
    border-radius: 5px;
    padding: 3px 6px;
  }
  .copy-toast.show { display: block; animation: toastIn 0.25s ease-out; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===================== LED 전광판 ===================== */
  .led-board {
    position: relative;
    margin-top: 5px;
    display: flex;
    align-items: stretch;
    min-height: 25px;
    background-color: #05080b;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(148, 163, 184, 0.09) 1px, transparent 1.7px);
    background-size: 4px 4px;
    border: 2px solid #1b2733;
    border-radius: 7px;
    box-shadow:
      inset 0 0 14px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(148, 163, 184, 0.12);
    overflow: hidden;
    transition: border-color 0.35s, box-shadow 0.35s, background-color 0.35s;
  }
  .led-board::after {
    /* 스캔라인 */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.35) 0px,
      rgba(0, 0, 0, 0.35) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    );
  }

  .led-tag {
    flex: none;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.07em;
    color: #94a3b8;
    background: linear-gradient(180deg, rgba(148, 163, 184, 0.16), rgba(148, 163, 184, 0.04));
    border-right: 1px solid #1b2733;
    transition: color 0.35s, background 0.35s, border-color 0.35s, text-shadow 0.35s;
  }
  .led-tag i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #64748b;
    transition: background 0.35s, box-shadow 0.35s;
  }

  .led-viewport {
    flex: 1 1 auto;
    min-width: 0;
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .led-track {
    display: inline-flex;
    flex: none;
    white-space: nowrap;
    will-change: transform;
    animation: ledScroll 16s linear infinite;
  }
  .led-group { display: inline-flex; flex: none; }
  .led-text {
    display: inline-block;
    padding-right: 34px;
    font-family: ui-monospace, SFMono-Regular, Menlo, "D2Coding", monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #cbd5e1;
    transition: color 0.35s, text-shadow 0.35s;
  }
  @keyframes ledScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .led-time {
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #94a3b8;
    background: rgba(10, 15, 20, 0.85);
    border-left: 1px solid #1b2733;
    transition: color 0.35s, border-color 0.35s, background 0.35s, text-shadow 0.35s;
  }

  /* ▶ 작업 중: 전광판이 켜지고 맥동한다 */
  .room.working .led-board {
    background-color: #04100c;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(74, 222, 128, 0.15) 1px, transparent 1.7px);
    border-color: #10321f;
    box-shadow:
      inset 0 0 14px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(148, 163, 184, 0.14),
      0 0 14px rgba(34, 197, 94, 0.3);
  }
  .room.working .led-text {
    color: #86efac;
    text-shadow: 0 0 5px rgba(74, 222, 128, 0.9), 0 0 13px rgba(34, 197, 94, 0.5);
    animation: ledGlow 2.2s ease-in-out infinite;
  }
  @keyframes ledGlow {
    0%, 100% { opacity: 1; text-shadow: 0 0 5px rgba(74,222,128,0.9), 0 0 13px rgba(34,197,94,0.5); }
    50% { opacity: 0.82; text-shadow: 0 0 9px rgba(74,222,128,1), 0 0 20px rgba(34,197,94,0.75); }
  }
  .room.working .led-tag {
    color: #4ade80;
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.22), rgba(34, 197, 94, 0.05));
    border-right-color: #14301f;
    text-shadow: 0 0 6px rgba(74, 222, 128, 0.85);
  }
  .room.working .led-tag i {
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: workPulse 1.2s ease-in-out infinite;
  }
  .room.working .led-time {
    color: #5eead4;
    border-left-color: #14301f;
    background: rgba(8, 20, 16, 0.85);
    text-shadow: 0 0 6px rgba(94, 234, 212, 0.8);
  }

  /* ■ 대기: 전광판은 정지 화면(스크롤 없음), 글자만 은은하게 */
  .room.idle .led-track { display: block; width: 100%; animation: none !important; }
  .room.idle .led-text { color: #aebccb; }
  .room.idle .led-time { color: #7b8a9c; }
  .led-static {
    display: block;
    width: 100%;
    padding-right: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 🔴 경보 */
  .room.alert .led-board {
    background-color: #0c0303;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(248, 113, 113, 0.18) 1px, transparent 1.7px);
    border-color: #7f1d1d;
    box-shadow:
      inset 0 0 14px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(148, 163, 184, 0.1),
      0 0 16px rgba(239, 68, 68, 0.6);
    animation: ledAlarm 1.5s ease-in-out infinite;
  }
  @keyframes ledAlarm {
    0%, 100% { box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 10px rgba(239,68,68,0.35); }
    50% { box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 22px rgba(239,68,68,0.85); }
  }
  .room.alert .led-text {
    color: #fecaca;
    text-shadow: 0 0 5px rgba(239, 68, 68, 0.95), 0 0 15px rgba(239, 68, 68, 0.65);
    animation: none;
  }
  .room.alert .led-tag {
    color: #fca5a5;
    background: linear-gradient(180deg, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.06));
    border-right-color: #3f1212;
    text-shadow: 0 0 6px rgba(239, 68, 68, 0.9);
  }
  .room.alert .led-tag i {
    background: #ef4444;
    box-shadow: 0 0 9px #ef4444;
    animation: blink 0.7s infinite;
  }
  .room.alert .led-time {
    color: #fca5a5;
    border-left-color: #3f1212;
    background: rgba(20, 4, 4, 0.85);
    text-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
  }

  /* 새 상태 수신 시 살짝 반짝 */
  .led-board.flash { animation: ledFlash 0.8s ease-out 1; }
  @keyframes ledFlash {
    0% { filter: brightness(2.1); }
    100% { filter: brightness(1); }
  }

  /* ===================== 💰 대표실 수익 전광판 ===================== */
  .rev-block {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .rev-pill {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    padding: 2px 6px;
    background-color: #04100c;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(74, 222, 128, 0.16) 1px, transparent 1.7px);
    background-size: 4px 4px;
    border: 1px solid #10321f;
    border-radius: 5px;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
    font-family: ui-monospace, SFMono-Regular, Menlo, "D2Coding", monospace;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    color: #86efac;
    text-shadow: 0 0 5px rgba(74, 222, 128, 0.85);
    transition: border-color 0.35s, box-shadow 0.35s;
  }
  .rev-pill .rev-sep { color: #2f6b45; text-shadow: none; margin: 0 3px; }
  .rev-pill .rev-today { color: #5eead4; text-shadow: 0 0 5px rgba(94, 234, 212, 0.8); }
  /* 오늘 실제 수익이 발생했을 때만 맥동 */
  .rev-pill.earned {
    border-color: #22c55e;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9), 0 0 12px rgba(34, 197, 94, 0.45);
    animation: revGlow 2.4s ease-in-out infinite;
  }
  @keyframes revGlow {
    0%, 100% { box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 8px rgba(34,197,94,0.35); }
    50% { box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 16px rgba(34,197,94,0.7); }
  }
  .rev-chart-wrap { position: relative; }
  .rev-chart {
    display: block;
    width: 100%;
    height: 22px;

/* ---------------- 💰 대표실 수익 (전광판 + 미니 그래프) ---------------- */
function revHTML() {
  return `
    <div class="rev-block" id="rev-block">
      <div class="rev-pill" id="rev-pill" title="검증된 실제 수익만 표시합니다">
        <span id="rev-total">누적 ₩0</span><span class="rev-sep">·</span><span class="rev-today" id="rev-today">오늘 +₩0</span>
      </div>
      <div class="rev-chart-wrap">
        <svg class="rev-chart" id="rev-chart" viewBox="0 0 140 30" preserveAspectRatio="none" role="img" aria-label="최근 7일 수익 0원"></svg>
        <span class="rev-empty" id="rev-empty">7일 수익 없음</span>
      </div>
      <div class="rev-labels" id="rev-labels"></div>
    </div>`;
}

function fmtKrw(n) {
  const v = Math.round(Number(n) || 0);
  return "₩" + v.toLocaleString("ko-KR");
}

function dayLabel(d) {
  return (d.getMonth() + 1) + "/" + d.getDate();
}

function normalizeRev(raw) {
  const src = (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : {};
  const num = (x) => { const n = Number(x); return Number.isFinite(n) ? n : 0; };
  const hist = Array.isArray(src.history) ? src.history.slice(-7) : [];
  let items = hist.map(h => {
    if (h && typeof h === "object") {
      return { label: String(h.label || h.date || h.d || ""), value: num(h.value !== undefined ? h.value : h.v) };
    }
    return { label: "", value: num(h) };
  });
  while (items.length < 7) items.unshift({ label: "", value: 0 });
  const today = new Date();
  const n = items.length;
  items = items.map((it, i) => {
    if (it.label) return it;
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (n - 1 - i));
    return { label: dayLabel(d), value: it.value };
  });
  return { total: num(src.total_krw), today: num(src.today_krw), items };
}

function renderRevenue(raw) {
  const d = normalizeRev(raw);
  const pill = document.getElementById("rev-pill");
  const totalEl = document.getElementById("rev-total");
  const todayEl = document.getElementById("rev-today");
  if (!pill || !totalEl || !todayEl) return;

  totalEl.textContent = "누적 " + fmtKrw(d.total);
  todayEl.textContent = "오늘 +" + fmtKrw(d.today);
  pill.classList.toggle("earned", d.today > 0);
  const block = document.getElementById("rev-block");
  if (block) block.classList.toggle("is-empty", d.items.every(it => Math.abs(it.value) === 0));

  const chart = document.getElementById("rev-chart");
  if (chart) {
    const W = 140, H = 30, base = H - 4, top = 3;
    const count = d.items.length || 7;
    const max = Math.max(1, ...d.items.map(x => Math.abs(x.value)));
    const slot = W / count;
    const bw = Math.max(5, Math.min(13, slot * 0.5));
    const empty = d.items.every(it => Math.abs(it.value) === 0);
    const parts = empty
      ? [`<line x1="2" y1="${base + 0.5}" x2="${W - 2}" y2="${base + 0.5}" stroke="#22303f" stroke-width="1" stroke-dasharray="3 3" />`]
      : [`<line x1="0" y1="${base + 0.5}" x2="${W}" y2="${base + 0.5}" stroke="#1e293b" stroke-width="1" />`];
    if (!empty) {
      for (let i = 1; i < count; i++) parts.push(`<line x1="${(slot * i).toFixed(1)}" y1="${top}" x2="${(slot * i).toFixed(1)}" y2="${base}" stroke="#141e29" stroke-width="1" />`);
    }
    if (!empty) d.items.forEach((it, i) => {
      const cx = slot * i + slot / 2;
      const v = Math.abs(it.value);
      const h = v > 0 ? Math.max(3, (v / max) * (base - top)) : 6;
      const y = base - h;
      const col = v > 0 ? (i === count - 1 ? "#5eead4" : "#4ade80") : "#33475c";
      parts.push(`<rect x="${(cx - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${col}"><title>${esc(it.label)} ${fmtKrw(it.value)}</title></rect>`);
    });
    chart.innerHTML = parts.join("");
    chart.setAttribute("aria-label", "최근 7일 수익 " + d.items.map(i => i.label + " " + fmtKrw(i.value)).join(", "));
  }

  const labels = document.getElementById("rev-labels");
  if (labels) labels.innerHTML = d.items.map(it => `<span>${esc(it.label)}</span>`).join("");
}

/* ---------------- 전광판 ---------------- */
function tickerFor(state, text) {
  if (state === "alert") return "🔴 " + String(text).replace(/^🔴\s*/, "");
  return text;
}

/* 전광판 글자 폭 어림값 (한글·이모지는 넓게) */
function estWidth(text) {
  let w = 0;
  for (const ch of String(text)) w += /[\u1100-\u11FF\u2E80-\u9FFF\uAC00-\uD7AF]/.test(ch) ? 10 : 6.2;
  return Math.max(60, w + 34);
}

function setBoardText(id, text, updated, state) {
  const track = document.getElementById("track-" + id);
  const vp = document.getElementById("vp-" + id);
  if (!track) return;
  const key = (state || "") + "|" + text;
  if (track.dataset.key !== key) {
    track.dataset.key = key;
    track.dataset.text = text;
    if (state === "idle") {
      // 대기 중에는 흐르지 않는 고정 표시
      track.innerHTML = `<span class="led-text led-static">${esc(text)}</span>`;
      track.style.animation = "none";
    } else {
      const vw = (vp && vp.clientWidth) || 160;
      const oneW = estWidth(text);
      const copies = Math.max(1, Math.ceil(vw / oneW));
      const group = Array.from({ length: copies }, () =>
        `<span class="led-text">${esc(text)}</span>`).join("");
      track.innerHTML =
        `<span class="led-group">${group}</span><span class="led-group" aria-hidden="true">${group}</span>`;
      const groupW = copies * oneW;
      const dur = Math.max(9, Math.min(34, groupW / 46));
      track.style.animation = "none";
      void track.offsetWidth;
      track.style.animation = "ledScroll " + dur.toFixed(1) + "s linear infinite";
    }
  }
  if (updated !== undefined) {
    const t = document.getElementById("time-" + id);
    if (t) t.textContent = updated || "--:--";
  }
}

function flashBoard(id) {
  const b = document.getElementById("led-" + id);
  if (!b) return;
  b.classList.remove("flash");
  void b.offsetWidth;
  b.classList.add("flash");
}

function setRoomState(id, state) {
  const el = document.getElementById("room-" + id);
  if (!el) return;
  el.classList.remove("working", "idle", "alert");
  el.classList.add(state);
  const tag = document.getElementById("tag-" + id);
  if (tag) tag.textContent = STATE_LABEL[state] || "IDLE";
}

let STATUS = null;      // 마지막으로 받은 status.json
let lastSync = "";

function applyStatus(data) {
  const src = (data && typeof data === "object" && !Array.isArray(data)) ? data : {};

  rooms.forEach(r => {
    const s = src[r.id] || {};
    let state;
    if (!s.status) state = r.state || "idle";
    else if (s.status === "alert") state = "alert";
    else if (s.status === "working") state = "working";
    else state = "idle";

    const tickerRaw = (typeof s.ticker === "string" && s.ticker.trim()) ? s.ticker.trim() : r.ticker;
    const updated = (typeof s.updated === "string" && s.updated.trim()) ? s.updated.trim() : r.updated;
    const ticker = tickerFor(state, tickerRaw);

    const track = document.getElementById("track-" + r.id);
    const before = track ? track.dataset.text : undefined;
    setBoardText(r.id, ticker, updated, state);

    const el = document.getElementById("room-" + r.id);
    if (!el) return;

    setRoomState(r.id, state);

    const say = document.getElementById("say-" + r.id);
    const foot = document.getElementById("foot-" + r.id);
    if (state === "alert") {
      if (say) say.textContent = "도와주세요! 🚨";
      if (foot) foot.textContent = "🔴 " + r.issue;
    } else {
      if (say) say.textContent = r.say;
      if (foot) foot.textContent = r.foot;
    }
    if (before !== undefined && before !== ticker) flashBoard(r.id);
  });

  applyRoam();
  // 수익 전광판·그래프 갱신 (status.json의 revenue)
  renderRevenue(src.revenue);
  updatePill();
}

function applyRoam() {
  const working = document.querySelectorAll(".room.working").length;
  setRoamActive(working > 0);
}

function setSyncNote(ok, msg) {
  const n = document.getElementById("sync-note");
  if (!n) return;
  n.textContent = msg;
  n.className = "sync-note " + (ok ? "live" : "stale");
}

function hhmm() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

async function loadStatus() {
  try {
    const res = await fetch("./status.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    applyStatus(data);
    STATUS = data;
    lastSync = hhmm();
    setSyncNote(true, "● status.json 동기화 " + lastSync);
  } catch (e) {
    if (!STATUS) {
      // 한 번도 못 받았을 때만 기본 문구/기본 상태 사용
      applyStatus(null);
      setSyncNote(false, "○ 기본 상태 표시 (status.json 대기)");
    } else {
      setSyncNote(false, "○ 연결 지연 · 마지막 상태 유지");
    }
  }
}

function toggleRoom(id) {
  const r = rooms.find(x => x.id === id);
  const el = document.getElementById("room-" + id);
  const say = document.getElementById("say-" + id);
  const foot = document.getElementById("foot-" + id);
  if (el.classList.contains("alert")) {
    // 경보 해제: 기본 상태가 alert인 방(카페 관리팀)은 대기로 돌린다
    const base = (r.state && r.state !== "alert") ? r.state : "idle";
    setRoomState(id, base);
    say.textContent = r.say;
    foot.textContent = r.foot;
    const toast = document.getElementById("toast-" + id);
    if (toast) toast.classList.remove("show");
  } else {
    setRoomState(id, "alert");
    say.textContent = "도와주세요! 🚨";
    foot.textContent = "🔴 " + r.issue;
  }
  applyRoam();
  updatePill();
}

/* 경보 내용을 복사해서 피클 채팅에 바로 붙여넣게 한다 */
function copyIssue(id) {
  const r = rooms.find(x => x.id === id);
  if (!r) return;
  const text = `[관제탑 해결] ${r.title}: ${r.issue}`;
  const toast = document.getElementById("toast-" + id);
  const showToast = () => {
    if (!toast) return;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove("show"), 3600);
  };
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (ok) showToast();
      else window.prompt("아래 문구를 복사해 피클 채팅에 붙여넣어 주세요", text);
    } catch (e) {
      window.prompt("아래 문구를 복사해 피클 채팅에 붙여넣어 주세요", text);
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(showToast).catch(fallback);
  } else {
    fallback();
  }
}

function testAlert() {
  const candidates = rooms.filter(r => r.id !== "ceo");
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const el = document.getElementById("room-" + pick.id);
  if (!el.classList.contains("alert")) toggleRoom(pick.id);
}

function clearAll() {
  rooms.forEach(r => {
    const el = document.getElementById("room-" + r.id);
    if (el.classList.contains("alert")) toggleRoom(r.id);
  });
}

function updatePill() {
  const alerts = document.querySelectorAll(".room.alert").length;
  const pill = document.getElementById("summary-pill");
  if (alerts > 0) {
    pill.textContent = `🔴 해결 요청 ${alerts}건`;
    pill.style.background = "#7f1d1d";
    pill.style.borderColor = "#ef4444";
    pill.style.color = "#fecaca";
  } else {
    // 경보 없음: 부서 전체가 가동 중인 상태 (부서 수는 rooms 기준 → 7개)
    pill.textContent = `🟢 ${rooms.length}개 부서 가동 중`;
    pill.style.background = "#0c2d48";
    pill.style.borderColor = "#38bdf8";
    pill.style.color = "#bae6fd";
  }
}

buildRoamers();
render();
updatePill();
loadStatus();
setInterval(loadStatus, 60000);
</script>
